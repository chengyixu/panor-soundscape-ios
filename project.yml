name: Soundscape
options:
  bundleIdPrefix: tech.panor
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: GM9T6P56A4
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Soundscape.entitlements
    # Build 23 was rejected by App Store Connect (ITMS-90111). The next
    # archive must use an Apple-accepted Xcode/SDK release candidate and a
    # strictly higher build number.
    CURRENT_PROJECT_VERSION: 24
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"

targets:
  Soundscape:
    type: application
    platform: iOS
    sources:
      - path: Sources/Soundscape
        excludes:
          - "**/CLAUDE.md"
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: GoogleSignIn
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Soundscape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: Used to record and publish real-world sounds.
        NSLocationWhenInUseUsageDescription: Used to place soundscapes at their recording locations; location is optional.
        NSPhotoLibraryUsageDescription: Used to choose a cover image for a soundscape.
        UIApplicationSupportsIndirectInputEvents: true
        GIDClientID: 692072605697-s1fr5grsef9srf2mnduq26fpa1tf1m8e.apps.googleusercontent.com
        GIDServerClientID: 692072605697-04nj1ecjnapmje7p2blouqac59ob59uj.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: tech.panor.soundscape
            CFBundleURLSchemes:
              - panorsoundscape
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.692072605697-s1fr5grsef9srf2mnduq26fpa1tf1m8e
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.panor.soundscape
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_NS_ASSERTIONS: false
          VALIDATE_PRODUCT: true
  SoundscapeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SoundscapeTests
    dependencies:
      - target: Soundscape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.panor.soundscape.tests
        GENERATE_INFOPLIST_FILE: true
  SoundscapeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SoundscapeUITests
    dependencies:
      - target: Soundscape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.panor.soundscape.ui-tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Soundscape:
    build:
      targets:
        Soundscape: all
        SoundscapeTests: [test]
        SoundscapeUITests: [test]
    test:
      targets:
        - SoundscapeTests
        - SoundscapeUITests
      gatherCoverageData: true
