name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ripgrep
      - run: xcodebuild -version
      - run: scripts/ci.sh

